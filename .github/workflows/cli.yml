# Vérifie la CLI de bout en bout sur CPU (sans GPU ni micro) : installation, discussion au
# clavier avec le vrai cerveau, et la chaîne audio sur fichiers (voix ZONOS3 -> Parakeet).
name: cli

on:
  workflow_dispatch:
  push:
    paths: ["omnifr/**", "pyproject.toml", ".github/workflows/cli.yml"]

jobs:
  cli:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libportaudio2
          pip install -e ".[voix,dev]"
          pip install --no-deps openwakeword==0.6.0
      - run: python -m pytest -q
      - name: Cache des binaires et modèles
        uses: actions/cache@v4
        with:
          path: ~/omnifr-modeles
          key: omnifr-cli-v2-${{ runner.arch }}
      - name: omnifr installer --cpu
        run: |
          omnifr materiel
          omnifr installer --cpu --profil 2070
      - name: omnifr discuter (demandes au clavier)
        run: |
          printf '%s\n' "Allume la cuisine et la chambre." "Désactive l'alarme." "Oui." \
            "Quel temps demain à Bordeaux ?" "Merci Jarvis." "" | omnifr discuter --ngl 0
      - name: Serveur ZONOS3 (voix fixe, modèle gardé en mémoire)
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          from omnifr.runtime import voice
          d = Path.home() / "omnifr-modeles"; cfg = json.loads((d / "config.json").read_text())
          t = time.time(); tts = voice.make_tts(Path(cfg["zonos3"]), None, gpu=False, log=d / "zonos3.log", engine="zonos3")
          print(type(tts).__name__, f"démarré en {time.time()-t:.1f} s")
          for txt in ["Bonjour.", "Il fait beau à Pessac.", "La porte est verrouillée."]:
              t = time.time(); x, sr = tts.synth(txt, "calme"); print(f"{len(x)/sr:.1f} s audio en {time.time()-t:.1f} s")
          PY
          tail -20 ~/omnifr-modeles/zonos3.log || true
      - name: Cerveau en flux (phrases transmises au fil de l'eau)
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          from omnifr.runtime.llm import LlamaServer, build_tools, system_prompt
          from omnifr.runtime.orchestrator import Orchestrator
          from omnifr.sim.home import HomeSimulator
          d = Path.home() / "omnifr-modeles"; cfg = json.loads((d / "config.json").read_text())
          with LlamaServer(cfg["llama_server"], cfg["cerveau"], ctx=8192, ngl=0, threads=4) as llm:
              sim = HomeSimulator(); o = Orchestrator(llm, sim, system_prompt(sim), build_tools(sim))
              for u in ["Bonjour Jarvis, présente-toi en deux phrases.", "Allume la cuisine et la chambre."]:
                  t = time.time()
                  r = o.turn(u, on_sentence=lambda s, e: print(f"  +{time.time()-t:.1f}s [{e}] {s}", flush=True))
                  print(f"fin +{time.time()-t:.1f}s ; actions {len(r.actions)} ; texte : {r.text}")
          PY
      - name: omnifr tester (CPU)
        run: omnifr tester --voix-cpu --ngl 0
      - name: Chaîne audio sur fichiers
        run: |
          python - <<'PY'
          from pathlib import Path
          from omnifr.runtime import voice
          d = Path.home() / "omnifr-modeles"
          import json; cfg = json.loads((d / "config.json").read_text())
          tts = voice.Zonos3(Path(cfg["zonos3"]), gpu=False)
          import time; t = time.time()
          x, sr = tts.synth("Bonsoir. La porte d'entrée est verrouillée.", "calme")
          print(f"voix : {len(x)/sr:.1f} s en {time.time()-t:.1f} s")
          from bench.eval_audio import resample
          asr = voice.Parakeet(d / "asr")
          print("transcription :", asr(resample(x, sr)))
          w = voice.WakeWord(); import numpy as np
          print("mot d'éveil chargé, silence ->", w(np.zeros(1280, np.float32)))
          PY
